default:
  image:
    name: ghcr.io/prefix-dev/pixi
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .pixi
      - _build
  before_script:
    - eval $(pixi shell-hook --shell bash)
    - pixi global install git
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - pixi install

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"
  SSH_COMMAND: "ssh -o UserKnownHostsFile=.ci/known_hosts -o StrictHostKeyChecking=yes"
  JUPYTER_NUM_PROCS: "10"
  HOST: "127.0.0.1"  # Needed to avoid binding to ::1.

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - when: never

build branch website:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  resource_group: pages-preview
  script:
    - export BASE_URL="$(python -c 'import os; from urllib.parse import urlsplit; print(urlsplit(os.environ["CI_PAGES_URL"]).path.rstrip("/"))')"
    - pixi run postprocess-html
  pages:
    publish: _build/html
  artifacts:
    paths: [_build/html/]
    expire_in: 1 week
  environment:
    name: preview
    url: $CI_PAGES_URL

build main website:
  only:
    - master@qt/topocm
  variables:
    WEBSITE_UPLOAD_PATH: /
  environment:
    name: published
    url: https://topocondmat.org/
  script:
    - eval "$(pixi run ssh-agent -s)"
    - chmod 400 "$WEBSITE_UPLOAD_KEY"
    - pixi run ssh-add "$WEBSITE_UPLOAD_KEY" >/dev/null
    - pixi run postprocess-html
    - pixi run rsync -ravz _build/html/ -e "$SSH_COMMAND" topocondmat@vps-cf5b3a69.vps.ovh.net:$WEBSITE_UPLOAD_PATH
